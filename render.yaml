# Render Infrastructure Blueprint (render.yaml)
# Free-Tier friendly deployment for Fintech Wallet & Double-Entry Ledger
services:
  # 1. Core Wallet & Double-Entry Ledger Service
  - type: web
    name: fintech-wallet-service
    env: docker
    dockerfilePath: Dockerfile.wallet
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: fintech-postgres
          property: connectionString
      - key: OUTBOX_PUBLISHER_ENABLED
        value: "false" # Set to "true" when connecting to Confluent Cloud or an external Kafka broker
      - key: OUTBOX_PUBLISHER_INTERVAL_MS
        value: "2000"
      # Optional Kafka configuration (Uncomment and fill if using Confluent Cloud / Aiven)
      - key: KAFKA_BOOTSTRAP_SERVERS
        value: "localhost:9092"
      - key: KAFKA_SECURITY_PROTOCOL
        value: "PLAINTEXT"
      # To enable Confluent Cloud, set:
      # KAFKA_BOOTSTRAP_SERVERS: "pkc-xxxx.us-east-1.aws.confluent.cloud:9092"
      # KAFKA_SECURITY_PROTOCOL: "SASL_SSL"
      # KAFKA_SASL_MECHANISM: "PLAIN"
      # KAFKA_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="<API_KEY>" password="<API_SECRET>";'
      # OUTBOX_PUBLISHER_ENABLED: "true"

  # 2. Notification Consumer Service
  - type: web
    name: fintech-notification-service
    env: docker
    dockerfilePath: Dockerfile.notification
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 8081
      - key: KAFKA_BOOTSTRAP_SERVERS
        value: "localhost:9092"
      - key: KAFKA_SECURITY_PROTOCOL
        value: "PLAINTEXT"

databases:
  # Managed PostgreSQL Database (Render Free Tier)
  - name: fintech-postgres
    databaseName: wallet_db
    user: fintech_user
    plan: free
    region: oregon
